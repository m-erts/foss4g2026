# Единственное место, где живут версии данных и пороги.
# Всё, что зашито в код константой, невоспроизводимо.

overture:
  # ВАЖНО: categories удаляются в сентябрьском релизе 2026.
  # Код написан под basic_category + taxonomy (схема v1.18+).
  release: "2026-07-22.0"
  s3_base: "s3://overturemaps-us-west-2/release"
  s3_region: "us-west-2"

grid:
  h3_resolution: 8          # доклад 1: равноплощадные ячейки
  min_poi_per_cell: 10      # ниже порога метрики разнообразия не считаем

# CRS по странам. Япония НЕ 3857 — Web Mercator даёт ячейки 700-900 м
# вместо километра (см. критический разбор, раздел 1.1).
crs:
  RS: 3035                  # ETRS89-LAEA, покрывает Западные Балканы
  GB: 27700                 # British National Grid
  JP: 6690                  # JGD2011 / UTM 53N; для сеточных операций - JIS X 0410
  NL: 28992                 # Amersfoort / RD New

# Пороги делимитации. Вынесены сюда для анализа чувствительности.
fua:
  seed_quantile: 0.98
  min_outflow_quantile: 0.0
  city_share: 0.5
  commute_thresholds: [0.15, 0.10]   # 0.15 - стандарт OECD

countries:
  RS: {name: "Serbia",         slug: "serbia",      anchor_city: "Belgrade"}
  GB: {name: "United Kingdom", slug: "uk",          anchor_city: "Manchester"}
  JP: {name: "Japan",          slug: "japan",       anchor_city: "Hiroshima"}
  NL: {name: "Netherlands",    slug: "netherlands", anchor_city: "Amsterdam"}
